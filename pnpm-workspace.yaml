packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
neverBuiltDependencies:
  - unrs-resolver
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
